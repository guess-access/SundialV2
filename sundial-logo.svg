<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 340" width="300" height="340"
     role="img" aria-labelledby="ssTitle ssDesc">
  <title id="ssTitle">Sundial Solstice — HR + Payroll</title>
  <desc id="ssDesc">Animated logo lockup: twin counter-rotating orbits around a pulsing core, with the Sundial Solstice wordmark and the HR + Payroll tagline below.</desc>

  <!--
    Vertical lockup: animated mark on top, wordmark, a short teal rule, tagline.
    All motion is CSS, no JavaScript — it loops forever with no start and no end.
    The wordmark and tagline are set in currentColor, so when this file is inlined
    into a page they follow that page's text colour (dark on a light theme, light on
    a dark one); opened on their own they render near-black on the viewer's white.
  -->
  <style>
    .sd-ring {
      fill: none;
      stroke: #00bfa6;
      stroke-width: 7;
      stroke-linecap: round;
      stroke-dasharray: 654;
      animation: sd-draw 1.4s cubic-bezier(.65, 0, .35, 1) both;
    }

    .sd-orbit {
      fill: none;
      stroke-width: 7;
      stroke-linecap: round;
      transform-box: view-box;
      transform-origin: 50% 50%;
    }

    .sd-orbit--a {
      stroke: #00bfa6;
      animation: sd-spin-a 16s linear infinite,
                 sd-fade .8s ease-out .25s both;
    }

    .sd-orbit--b {
      stroke: #ff8b7e;
      animation: sd-spin-b 22s linear infinite,
                 sd-fade .8s ease-out .45s both;
    }

    .sd-dotwrap {
      transform-box: fill-box;
      transform-origin: center;
      animation: sd-pop .7s cubic-bezier(.2, .9, .3, 1.5) .5s both;
    }

    .sd-halo {
      fill: none;
      stroke: #a5d637;
      stroke-width: 5;
      opacity: 0;
      transform-box: fill-box;
      transform-origin: center;
      animation: sd-ping 2.4s ease-out 1.3s infinite;
    }

    .sd-dot {
      fill: #a5d637;
      transform-box: fill-box;
      transform-origin: center;
      animation: sd-pulse 2.4s ease-in-out 1.3s infinite;
    }

    .sd-word,
    .sd-tag {
      font-family: "Segoe UI", Inter, "Helvetica Neue", Helvetica, Arial, sans-serif;
      text-anchor: middle;
      fill: currentColor;
    }

    .sd-word {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: 1.2px;
      animation: sd-rise .55s cubic-bezier(.2, .9, .3, 1) 1.05s both;
    }

    .sd-tag {
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 4.5px;
      animation: sd-rise-soft .55s cubic-bezier(.2, .9, .3, 1) 1.3s both;
    }

    .sd-rule {
      stroke: #00bfa6;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-dasharray: 56;
      animation: sd-rule .5s ease-out 1.2s both;
    }

    @keyframes sd-spin-a { to { transform: rotate(360deg); } }
    @keyframes sd-spin-b { to { transform: rotate(-360deg); } }
    @keyframes sd-fade   { from { opacity: 0; } to { opacity: 1; } }
    @keyframes sd-draw   { from { stroke-dashoffset: 654; } to { stroke-dashoffset: 0; } }
    @keyframes sd-pop    { from { opacity: 0; transform: scale(.4); } to { opacity: 1; transform: scale(1); } }
    @keyframes sd-pulse  { 0%, 100% { transform: scale(1); opacity: 1; } 50% { transform: scale(1.3); opacity: .78; } }
    @keyframes sd-ping   { 0% { transform: scale(1); opacity: .55; } 70%, 100% { transform: scale(3.4); opacity: 0; } }
    @keyframes sd-rule   { from { stroke-dashoffset: 56; } to { stroke-dashoffset: 0; } }
    @keyframes sd-rise   { from { opacity: 0; transform: translateY(9px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes sd-rise-soft { from { opacity: 0; transform: translateY(9px); } to { opacity: .8; transform: translateY(0); } }

    @media (prefers-reduced-motion: reduce) {
      .sd-ring, .sd-orbit, .sd-dotwrap, .sd-halo, .sd-dot,
      .sd-word, .sd-tag, .sd-rule {
        animation: none !important;
        stroke-dashoffset: 0 !important;
        opacity: 1 !important;
        transform: none !important;
      }
      .sd-halo { opacity: 0 !important; }
      .sd-tag { opacity: .8 !important; }
    }
  </style>

  <g transform="translate(30,0)">
    <circle class="sd-ring" cx="120" cy="120" r="104"/>

    <g class="sd-orbit sd-orbit--a">
      <ellipse cx="120" cy="120" rx="95" ry="44" transform="rotate(-44 120 120)"/>
    </g>
    <g class="sd-orbit sd-orbit--b">
      <ellipse cx="120" cy="120" rx="95" ry="44" transform="rotate(44 120 120)"/>
    </g>

    <g class="sd-dotwrap">
      <circle class="sd-halo" cx="120" cy="120" r="16"/>
      <circle class="sd-dot"  cx="120" cy="120" r="16"/>
    </g>
  </g>

  <text class="sd-word" x="150" y="284">SUNDIAL SOLSTICE</text>
  <line class="sd-rule" x1="122" y1="302" x2="178" y2="302"/>
  <text class="sd-tag" x="150" y="324">HR + PAYROLL</text>
</svg>
